kind = "mobile"
previewPath = "/"
title = "Guardian Angel"
version = "1.0.0"
id = "artifacts/guardian-angel"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
localPort = 23284
name = "expo"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/guardian-angel run dev"

[services.env]
PORT = "23284"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/guardian-angel", "run", "build"]
run = ["pnpm", "--filter", "@workspace/guardian-angel", "run", "serve"]
